# slam_toolbox 在线异步建图参数
# 文档: https://github.com/SteveMacenski/slam_toolbox

slam_toolbox:
  ros__parameters:
    # 话题 / 坐标系
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # 建图模式: mapping (建图) / localization (定位)
    mode: mapping

    # 求解器
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_use_block_sparse: true
    ceres_minimizer_progress_type: SILENT
    ceres_max_num_iterations: 10
    ceres_num_threads: 4
    ceres_loss_function_type: HUBER
    ceres_loss_function_rho: 1.0

    # 前端扫描匹配
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 10.0
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 3.0
    map_update_interval: 1.0

    # 存储 / 加载地图
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true
    debug_logging: false